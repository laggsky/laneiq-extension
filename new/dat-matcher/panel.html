<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'">
  <title>LaneIQ</title>
  <link rel="stylesheet" href="content.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
      background: #f5f5f7; }

    /* Full-window flex column — mirrors #dlm-panel layout without fixed positioning */
    #dlm-wrap { display: flex; flex-direction: column; height: 100vh; }

    /* Reuse panel header style; override grab cursor — OS window handles drag */
    #dlm-panel-hdr { cursor: default; flex-shrink: 0; }
    #dlm-panel-hdr:active { cursor: default; }

    /* Search bar flush to header */
    #dlm-search-wrap { flex-shrink: 0; }

    /* Body fills remaining height */
    #dlm-body { flex: 1; min-height: 0; }

    /* Live-update flash */
    @keyframes dlm-refresh { 0%{background:#f0fdf4} 100%{background:#f5f5f7} }
    #dlm-body.dlm-refreshed { animation: dlm-refresh .6s ease; }

    /* Header button group */
    .dlm-hdr-btns { display:flex; align-items:center; gap:1px; }

    /* Search icon */
    .dlm-search-icon { color:#4b5563; font-size:13px; flex-shrink:0; line-height:1; }

    /* Initial loading placeholder */
    .dlm-placeholder { text-align:center; padding:36px 20px; color:#aeaeb2; font-size:13px; line-height:1.6; }

    /* Sidebar nav */
    #dlm-panel-main { display:flex; flex-direction:row; flex:1; min-height:0; overflow:hidden; }
    #dlm-sidebar { width:92px; flex-shrink:0; background:#f2f2f7; display:flex; flex-direction:column; padding:8px 0 8px 6px; gap:4px; border-right:1px solid rgba(0,0,0,.06); overflow-y:auto; }
    #dlm-content { display:flex; flex-direction:column; flex:1; min-width:0; overflow:hidden; background:#fff; }
    .dlm-tab { width:100%; padding:12px 8px; font-size:11px; font-weight:500; color:#6e6e73; background:transparent; border:none; border-right:3px solid transparent; border-radius:8px 0 0 8px; cursor:pointer; letter-spacing:.01em; transition:background .12s,color .12s,border-color .12s; font-family:inherit; text-align:center; line-height:1.4; word-break:break-word; }
    .dlm-tab.dlm-tab-active { background:#fff; color:#0058e0; font-weight:600; border-right:3px solid #0058e0; }
    .dlm-tab:hover:not(.dlm-tab-active) { background:rgba(0,0,0,.04); color:#3a3a3c; }
    .dlm-tab:not(:last-child) { border-bottom:1px solid rgba(0,0,0,.08); }

    /* Templates */
    .dlm-tpl-area { width:100%; border:1px solid #e5e5ea; border-radius:8px; padding:7px 9px; font-size:11px; font-family:inherit; color:#1d1d1f; background:#f9f9fb; resize:vertical; outline:none; box-sizing:border-box; line-height:1.5; }
    .dlm-tpl-area:focus { border-color:#0058e0; background:#fff; box-shadow:0 0 0 2px rgba(0,88,224,.12); }

    /* Heart button */
    .dlm-heart-btn { background:none; border:none; cursor:pointer; font-size:20px; font-weight:700; color:#c7c7cc; padding:0; width:28px; line-height:1; display:inline-flex; align-items:center; justify-content:center; transition:color .15s; flex-shrink:0; }
    .dlm-heart-btn:hover { opacity:.75; }
    .dlm-heart-btn.dlm-loved { color:#e05c5c; }
  </style>
</head>
<body>
  <div id="dlm-wrap">
    <div id="dlm-panel-hdr">
      <span id="dlm-title">◈ Load History</span>
      <div class="dlm-hdr-btns">
        <button id="dlm-close" title="Close window">✕</button>
      </div>
    </div>

    <div id="dlm-panel-main">
      <div id="dlm-sidebar">
        <button class="dlm-tab dlm-tab-active" data-tab="history">Load History</button>
        <button class="dlm-tab" data-tab="loved">Preferred</button>
        <button class="dlm-tab" data-tab="regions">Hot Regions</button>
        <button class="dlm-tab" data-tab="templates">Templates</button>
        <button class="dlm-tab" data-tab="setup">Setup</button>
        <button class="dlm-tab" data-tab="notes">Notes</button>
      </div>
      <div id="dlm-content">
        <div id="dlm-search-wrap">
          <span class="dlm-search-icon">⌕</span>
          <input id="dlm-search" type="text" placeholder="Search origin, destination, broker, load #…"
                 autocomplete="off" spellcheck="false">
          <button id="dlm-search-clear" title="Clear search">✕</button>
        </div>
        <div id="dlm-body">
          <div class="dlm-placeholder">Loading…</div>
        </div>
      </div>
    </div>
  </div>
  <script src="panel.js"></script>
</body>
</html>
